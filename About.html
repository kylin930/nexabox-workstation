<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 · Nexabox Workstation</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1d23;
            font-family: 'Segoe UI', 'Roboto', 'Consolas', monospace;
            color: #e0e8f0;
            padding: 24px 28px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .version {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .version strong { color: #4a8bf5; font-weight: 600; }
        .codename {
            font-size: 14px;
            color: #8a9bb5;
            margin-bottom: 18px;
            border-bottom: 1px solid #2f3644;
            padding-bottom: 14px;
        }
        .contributors {
            font-size: 13px;
            line-height: 1.8;
            color: #b0c0d6;
        }
        .contributors a {
            color: #4a8bf5;
            text-decoration: none;
        }
        .contributors a:hover { text-decoration: underline; }
        .contributors .label {
            color: #4a5a6e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Consolas', monospace;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #3a4050;
            border-top: 1px solid #2f3644;
            padding-top: 12px;
            text-align: right;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="version"><strong>Nexabox Workstation[Public]</strong> pre-0.4-public</div>
    <div class="codename">版本代号：Public Whiteboard</div>

    <div class="contributors">
        <div><span class="label">主要贡献</span><br>
            <a href="https://github.com/kylin930/" target="_blank">小林</a><br>
            <a href="https://github.com/OFFMN-SHARP/" target="_blank">OFFFMN-SHARP</a>
        </div>
        <div style="margin-top: 10px;">
            <span class="label">AI Agent 模块贡献</span><br>
            <a href="https://github.com/DIS310" target="_blank">DIS310</a>
        </div>
    </div>

    <div class="footer">Nexabox Studio · 2026</div>
</body>
</html>
